  output-dir: _book

book:
  title: "Marketing Analytics"
  author: "Nils Wlömert"
  date: last-modified
  chapters:
    - index.qmd
    - 01-foundations.qmd
  # Add further chapters here as they are migrated, e.g.:
  #  - 02-describing-data.qmd
